[project]
name = "fantasyfootball-app"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.9,<3.10"
dependencies = [
    "openpyxl>=3.1,<4",
    "pandas>=2.3.3",
    "pypdf>=5.0.0",
    "python-dotenv>=1.0.0",
    "requests>=2.32.5",
    "streamlit>=1.50.0",
    "urllib3>=1.26.18,<2",
]

[tool.uv]
# This is a Streamlit script app (app.py + src/), not a distributable
# library -- there is no installable `fantasyfootball_app` package, so
# uv must not try to build/install the project itself, only its
# dependencies. Without this, `uv sync`/`uv run` fail looking for
# src/fantasyfootball_app/__init__.py, which was never meant to exist.
package = false

[dependency-groups]
dev = [
    "pytest>=8.4.2",
]

[tool.pytest.ini_options]
# `tests/` import `src...` as an absolute package; without this, only
# `python -m pytest` (which puts the cwd on sys.path) resolves that.
# `pythonpath` makes plain `pytest` / `uv run pytest` work too.
pythonpath = ["."]
